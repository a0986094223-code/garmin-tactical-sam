name: Build Garmin Fenix 7X PRG
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Developer Key
        run: |
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in developer_key.pem -out developer_key.der -nocrypt

      - name: Compile Fenix 7X WatchFace (.PRG)
        uses: lindell/connect-iq-build-action@v1
        with:
          developer_key: developer_key.der
          device: fenix7x
          output_path: TacticalSAM.prg

      - name: Upload TacticalSAM.prg
        uses: actions/upload-artifact@v4
        with:
          name: Fenix7X-TacticalSAM-PRG
          path: TacticalSAM.prg

