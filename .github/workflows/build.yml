name: Build Garmin Fenix 7X PRG
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kalemena/connectiq:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Auto-generate Launcher Icon & Drawables XML
        run: |
          mkdir -p resources/drawables
          cat << 'EOF' > resources/drawables/drawables.xml
          <drawables>
              <bitmap id="LauncherIcon" filename="launcher_icon.png" />
          </drawables>
          EOF
          python3 -c '
          import zlib, struct
          w, h = 40, 40
          raw = b"".join(b"\x00" + b"\x07\x24\x36\xff" * w for _ in range(h))
          def chunk(tag, data):
              return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack("!IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
          open("resources/drawables/launcher_icon.png", "wb").write(png)
          '

      - name: Generate Developer Key
        run: |
          openssl genrsa -out developer_key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER -in developer_key.pem -out developer_key.der -nocrypt

      - name: Compile TacticalSAM.prg for Fenix 7X
        run: |
          monkeyc -d fenix7x -f monkey.jungle -o TacticalSAM.prg -y developer_key.der

      - name: Upload TacticalSAM.prg
        uses: actions/upload-artifact@v4
        with:
          name: Fenix7X-TacticalSAM-PRG
          path: TacticalSAM.prg
